name: Build APK

# Запуск:
# 1) Автоматически: при push в main или arena/**, или push тега v*
# 2) Вручную: вкладка Actions → "Build APK" → "Run workflow"
on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза (пусто = только артефакт в Actions, без Release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK packages (platform 35, build-tools, NDK r27, CMake)
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          yes | $SDKMANAGER --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/HuiTouch-1.0.0-debug.apk"

      - name: Upload to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: huitouch-apk
          path: dist/*.apk
          retention-days: 30

      - name: Determine release tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.vars.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: HUI-TOUCH ${{ steps.vars.outputs.release_tag }}
          body: |
            HUI-TOUCH — универсальный гироскоп для игр (NDK + Shizuku).

            **Файл:** `HuiTouch-1.0.0-debug.apk` — debug-сборка (подписана debug-ключом
            GitHub Actions, устанавливается напрямую; `debuggable=true`).

            Установка: включите «Установить из неизвестных источников», затем откройте APK.
            Первый запуск: авторизуйте Shizuku → разрешение overlay → панель калибровки.

            Подробности в README.
          files: dist/*.apk
          draft: false
          prerelease: false
